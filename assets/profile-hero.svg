<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">ConstArt portfolio banner</title>
  <desc id="description">Constantine Artemiou — UI/UX Design, Creative Development, and Digital Art</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0C10" />
      <stop offset="0.55" stop-color="#101319" />
      <stop offset="1" stop-color="#090B0F" />
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1DEB2" />
      <stop offset="0.5" stop-color="#CDAA68" />
      <stop offset="1" stop-color="#806437" />
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D0AE6E" stop-opacity="0.16" />
      <stop offset="1" stop-color="#D0AE6E" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="22" y="22" width="1156" height="376" rx="18" />
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#background)" />
  <g clip-path="url(#frameClip)">
    <rect x="22" y="22" width="1156" height="376" fill="url(#grid)" />
    <circle cx="1010" cy="210" r="260" fill="url(#halo)" />

    <g opacity="0.88">
      <circle cx="1000" cy="210" r="132" fill="none" stroke="#CDAA68" stroke-opacity="0.32" stroke-width="1" />
      <circle cx="1000" cy="210" r="96" fill="none" stroke="#F1DEB2" stroke-opacity="0.48" stroke-width="1.25" />
      <circle cx="1000" cy="210" r="58" fill="none" stroke="url(#gold)" stroke-width="2" />

      <path d="M868 210H1132 M1000 78V342" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" />
      <path d="M907 117L1093 303 M1093 117L907 303" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

      <path d="M1000 114 A96 96 0 0 0 1000 306" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-width="5" filter="url(#softGlow)" />
      <circle cx="1000" cy="210" r="6" fill="#F1DEB2" />
      <circle cx="1000" cy="114" r="4" fill="#CDAA68" />
      <circle cx="1000" cy="306" r="4" fill="#806437" />
      <circle cx="868" cy="210" r="3" fill="#FFFFFF" fill-opacity="0.6" />
      <circle cx="1132" cy="210" r="3" fill="#FFFFFF" fill-opacity="0.6" />
    </g>

    <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
      <text x="76" y="78" fill="#CDAA68" font-size="13" font-weight="600" letter-spacing="3.5">CONSTANTINE ARTEMIOU / PORTFOLIO</text>

      <text x="72" y="205" fill="#F4F1E8" font-size="82" font-weight="650" letter-spacing="5">CONST<tspan fill="url(#gold)">ART</tspan></text>

      <text x="76" y="250" fill="#D5D7DC" font-size="17" font-weight="500" letter-spacing="3.2">UI/UX DESIGN · CREATIVE DEVELOPMENT</text>

      <line x1="76" y1="286" x2="640" y2="286" stroke="#CDAA68" stroke-opacity="0.58" />
      <circle cx="76" cy="286" r="3" fill="#F1DEB2" />

      <text x="76" y="333" fill="#9EA3AD" font-size="17" font-weight="400" letter-spacing="0.4">Visual systems for meaningful digital experiences.</text>
    </g>
  </g>

  <rect x="22.5" y="22.5" width="1155" height="375" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" />
</svg>
